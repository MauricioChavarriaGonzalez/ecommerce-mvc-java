<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>Tu Carrito de Compras 🛒</h2>
    <a th:href="@{/productos}" class="btn btn-secondary mb-3">← Seguir Comprando</a>

    <!-- Si el carrito NO está vacío, mostramos la tabla -->
    <table class="table table-bordered shadow-sm" th:if="${!carrito.items.isEmpty()}">
        <thead class="table-dark">
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            <!-- Recorremos los items del carrito -->
            <tr th:each="item : ${carrito.items}">
                <td th:text="${item.producto.nombre}">Producto</td>
                
                <!-- Formateamos el precio unitario a 2 decimales -->
                <td th:text="'$' + ${#numbers.formatDecimal(item.producto.precio, 1, 2)}">Precio</td>
                
                <td th:text="${item.cantidad}">Cantidad</td>
                
                <!-- Formateamos el subtotal a 2 decimales -->
                <td th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">Subtotal</td>
                
                <td>
                    <a th:href="@{/carrito/eliminar/{id}(id=${item.producto.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3" class="text-end fw-bold fs-5">Total a Pagar:</td>
                
                <!-- Formateamos el total general a 2 decimales -->
                <td colspan="2" th:text="'$' + ${#numbers.formatDecimal(carrito.total, 1, 2)}" class="fw-bold fs-5 text-success">Total</td>
            </tr>
        </tfoot>
    </table>

    <!-- Si el carrito está vacío, mostramos un mensaje -->
    <div class="alert alert-warning" th:if="${carrito.items.isEmpty()}">
        Tu carrito está vacío. ¡Ve a comprar algo!
    </div>

    <!-- Botón para finalizar la compra -->
    <div th:if="${!carrito.items.isEmpty()}" class="mt-3">
        <a th:href="@{/carrito/comprar}" class="btn btn-primary btn-lg w-100 shadow">Procesar Compra 💳</a>
    </div>
</body>
</html>
