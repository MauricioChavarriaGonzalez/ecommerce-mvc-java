<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tienda en Línea - Productos</title>
    <!-- Usamos Bootstrap para que se vea bonito sin escribir CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <nav class="navbar navbar-light bg-light mb-4 px-3 rounded shadow-sm">
        <span class="navbar-brand mb-0 h1">Mi E-commerce MVC</span>
        <a th:href="@{/carrito}" class="btn btn-primary">Ver Carrito 🛒</a>
    </nav>

    <!-- Alerta que aparece cuando terminas una compra -->
    <div class="alert alert-success" th:if="${param.compraExitosa}">
        ¡Compra realizada con éxito!
    </div>

    <h2>Catálogo de Productos</h2>
    <div class="row">
        <!-- Thymeleaf recorre la lista de productos que le enviamos desde Java -->
        <div class="col-md-4 mb-4" th:each="producto : ${productos}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${producto.nombre}">Nombre Producto</h5>
                    <p class="card-text text-muted" th:text="${producto.descripcion}">Descripción</p>
                    <p class="card-text fw-bold text-success" th:text="'$' + ${producto.precio}">Precio</p>
                    <!-- El enlace pasa el ID del producto a nuestro CarritoController -->
                    <a th:href="@{/carrito/agregar/{id}(id=${producto.id})}" class="btn btn-success w-100">Agregar al Carrito</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
